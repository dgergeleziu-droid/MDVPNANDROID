# gradle.properties
# НАЗНАЧЕНИЕ: настройки Gradle и Android на уровне проекта.

# JVM heap для Gradle — иначе на слабых раннерах падает OOM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Использовать AndroidX (обязательно для Compose).
android.useAndroidX=true

# Kotlin-стиль кода.
kotlin.code.style=official

# Не генерировать R-классы для всех зависимостей (ускоряет сборку).
android.nonTransitiveRClass=true
