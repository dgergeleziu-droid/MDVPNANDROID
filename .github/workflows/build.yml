# .github/workflows/build.yml
# НАЗНАЧЕНИЕ: собрать debug-APK при каждом пуше.
# ОТЛИЧИЕ ОТ ПРОШЛОЙ ВЕРСИИ: убрал cache (он и падал), убрал gradlew
# (его нет в репо), использую gradle/actions/setup-gradle — он сам ставит Gradle.

name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # кнопка "Run workflow" вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ставим JDK 17 — стандарт для Android Gradle Plugin 8.x
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Ставим Gradle 8.7 через официальный экшен.
      #    Он сам скачает нужную версию — wrapper не требуется.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Собираем debug-APK. gradle (не ./gradlew) — команда доступна после шага 3.
      - name: Build Debug APK
        run: gradle assembleDebug

      # 5. Загружаем APK как артефакт — скачаешь со вкладки Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
